<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your AquaElite member account to view your batch schedule, progress reports, and coach feedback.">
    <title>Sign In | AquaElite Swimming Academy</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#0077B6', secondary: '#1B2A4A' } } } }</script>
</head>
<body class="min-h-screen bg-gradient-mesh flex flex-col">

<!-- Auth Top Bar -->
<div class="flex items-center justify-between p-4 sm:p-6 max-w-7xl mx-auto w-full">
    <div></div>
    <div class="flex items-center gap-2">
        <button id="auth-dir-btn" onclick="toggleAuthDir()" class="w-9 h-9 flex items-center justify-center rounded-lg bg-white/10 border border-white/15 text-white/60 hover:text-white transition-all text-[10px] font-black" title="Toggle Direction">LTR</button>
        <button id="auth-theme-btn" onclick="toggleAuthTheme()" class="w-9 h-9 flex items-center justify-center rounded-lg bg-white/10 border border-white/15 text-white/60 hover:text-white transition-all" title="Toggle Theme">
            <i id="auth-theme-icon" class="fas fa-moon text-sm"></i>
        </button>
    </div>
</div>

<!-- Card -->
<main class="flex-grow flex items-center justify-center px-4 sm:px-6 lg:px-8 py-8 w-full">
    <div class="w-full max-w-md mx-auto">
        <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl border border-slate-100 dark:border-slate-700 p-8 sm:p-10 animate-fade-in-up relative overflow-hidden">
            <!-- Decorative orb -->
            <div class="absolute -top-16 -right-16 w-32 h-32 bg-[#0077B6]/8 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -bottom-10 -left-10 w-24 h-24 bg-sky-300/8 rounded-full blur-xl pointer-events-none"></div>

            <!-- Logo + Header -->
            <div class="text-center mb-8 relative flex flex-col items-center">
                <a href="index.html" class="flex items-center gap-3 mb-5 group justify-center logo-bounce" aria-label="AquaElite Home">
                    <div class="relative w-10 h-10 shrink-0">
                        <img src="assets/images/logo.png" alt="AquaElite Logo" class="w-10 h-10 rounded-xl object-cover shadow-lg" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                        <div style="display:none;" class="w-10 h-10 bg-[#0077B6] rounded-xl items-center justify-center shadow-lg">
                            <svg width="24" height="24" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path d="M15 55 Q25 45 35 55 Q45 65 55 55 Q65 45 75 55" stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
                                <path d="M10 68 Q20 58 30 68 Q40 78 50 68" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
                            </svg>
                        </div>
                    </div>
                    <div class="flex flex-col leading-none text-left">
                        <span class="font-black text-slate-900 dark:text-white text-base tracking-tight" style="font-family:'Poppins',sans-serif;">AQUA</span>
                        <span class="font-bold text-[#0077B6] dark:text-sky-400 text-[10px] tracking-[0.2em] uppercase">Swimming Academy</span>
                    </div>
                </a>
                <h1 class="text-2xl font-black text-slate-900 dark:text-white" style="font-family:'Poppins',sans-serif;">Welcome Back</h1>
                <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">Sign in to your AquaElite account</p>
            </div>

            <!-- Social Login -->
            <div class="grid grid-cols-3 gap-3 mb-7">
                <button type="button" class="flex items-center justify-center h-12 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all" aria-label="Sign in with Google">
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                </button>
                <button type="button" class="flex items-center justify-center h-12 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all dark:text-white" aria-label="Sign in with Apple">
                    <i class="fab fa-apple text-lg shrink-0"></i>
                </button>
                <button type="button" class="flex items-center justify-center h-12 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 transition-all" aria-label="Sign in with Facebook">
                    <i class="fab fa-facebook-f text-lg shrink-0" style="color:#1877f2;"></i>
                </button>
            </div>

            <!-- Divider -->
            <div class="flex items-center gap-4 mb-7">
                <div class="flex-1 h-px bg-slate-200 dark:bg-slate-700"></div>
                <span class="text-xs text-slate-400 font-bold uppercase tracking-widest">or email</span>
                <div class="flex-1 h-px bg-slate-200 dark:bg-slate-700"></div>
            </div>

            <!-- Form -->
            <form class="space-y-4" id="login-form" onsubmit="submitLogin(event)">
                <div>
                    <label class="block text-xs font-black uppercase tracking-widest text-slate-400 mb-1.5" for="login-email">Email Address</label>
                    <div class="relative">
                        <input id="login-email" type="email" placeholder="arun@example.com" class="form-input ps-11" required>
                        <i class="fas fa-envelope absolute start-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm pointer-events-none"></i>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-black uppercase tracking-widest text-slate-400 mb-1.5" for="login-password">Password</label>
                    <div class="relative">
                        <input id="login-password" type="password" placeholder="••••••••" class="form-input ps-11 pe-11" required>
                        <i class="fas fa-lock absolute start-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm pointer-events-none"></i>
                        <button type="button" onclick="togglePwd('login-password','login-eye-icon')" class="absolute end-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-[#0077B6] transition-colors" aria-label="Toggle password visibility">
                            <i class="fas fa-eye text-sm" id="login-eye-icon"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" class="w-4 h-4 rounded accent-[#0077B6]">
                        <span class="text-slate-600 dark:text-slate-400 font-medium text-xs">Remember Me</span>
                    </label>
                    <a href="#" class="text-[#0077B6] font-black text-xs hover:underline">Forgot Password?</a>
                </div>

                <button type="submit" id="login-btn" class="btn-primary w-full py-4 text-sm mt-1">
                    Sign In <i class="fas fa-arrow-right text-xs"></i>
                </button>
            </form>

            <p class="text-center text-sm text-slate-500 dark:text-slate-400 mt-7">
                Don't have an account? <a href="signup.html" class="text-[#0077B6] font-black hover:underline">Sign Up Free</a>
            </p>
        </div>

        <p class="text-center text-xs text-white/30 mt-6">
            &copy; <script>document.write(new Date().getFullYear())</script> Aqua Swimming Academy &middot; <a href="#" class="hover:text-white/50 transition-colors">Privacy</a> &middot; <a href="#" class="hover:text-white/50 transition-colors">Terms</a>
        </p>
    </div>
</main>

<script src="components.js"></script>
<script>
(function() {
    const html = document.documentElement;
    if (localStorage.getItem('aqua_theme') === 'dark' || (!localStorage.getItem('aqua_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        html.classList.add('dark');
        const icon = document.getElementById('auth-theme-icon');
        if (icon) icon.className = 'fas fa-sun text-sm text-sky-400';
    }
    if (localStorage.getItem('aqua_dir') === 'rtl') {
        html.setAttribute('dir', 'rtl');
        const btn = document.getElementById('auth-dir-btn');
        if (btn) btn.textContent = 'RTL';
    }
})();
</script>
</body>
</html>
